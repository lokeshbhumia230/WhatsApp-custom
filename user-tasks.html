<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Tasks</title><style>body{font-family:system-ui;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.task{border:1px solid #ddd;border-radius:12px;padding:16px;margin:10px 0}.muted{color:#666;font-size:13px}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.msg{margin:12px 0}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>Available Tasks</h1><div id="msg" class="muted">Loading...</div><div id="list"></div></main><script>async function load(){let r=await fetch('/api/user/tasks');if(r.status===401){location='/login';return}let d=await r.json();if(d.status!=='success'){msg.textContent=d.message||'Unable to load tasks';return}list.innerHTML=d.tasks.length?d.tasks.map(t=>'<div class="task"><h3>'+t.title+'</h3><p>'+t.message+'</p><p class="muted">Target: '+t.target_phone+' • Reward: ₹'+Number(t.reward).toFixed(2)+'</p><button onclick="claim(\''+t.id+'\')">Complete Task</button></div>').join(''):'<div class="card">No available tasks right now.</div>'}async function claim(id){let w=await fetch('/api/user/whatsapp');let d=await w.json();if(d.status!=='success'||!d.accounts.length){msg.textContent='Please link a WhatsApp account first.';return}let active=d.accounts.filter(x=>x.status==='active'&&x.connected);if(!active.length){msg.textContent='No connected WhatsApp account available.';return}let aid=active[0].id;msg.textContent='Sending...';let r=await fetch('/api/user/tasks/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,whatsapp_account_id:aid})});let x=await r.json();msg.textContent=x.message||'Done';load()}load()</script></body></html>
