<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Tasks</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.muted{color:#666;font-size:13px}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>Available Tasks</h1><div id="list">Loading...</div></main><script>async function load(){let r=await fetch('/api/user/tasks');if(r.status===401){location.href='/login';return}let d=await r.json();list.innerHTML=(d.tasks||[]).map(t=>`<article class="card"><h2>${esc(t.title)}</h2><p>${esc(t.message)}</p><p><b>Reward: ₹${Number(t.reward).toFixed(2)}</b></p><button onclick="claim('${t.id}')">Complete Task</button></article>`).join('')||'<p class="muted">No tasks available right now.</p>'}async function claim(id){let w=await fetch('/api/user/whatsapp');let d=await w.json();let a=(d.accounts||[]).filter(x=>x.status==='active'&&x.connected);if(!a.length){alert('Please connect a WhatsApp account first.');location.href='/whatsapp';return}let pick=a.length===1?a[0]:a[Number(prompt('Select WhatsApp: '+a.map((x,i)=>`${i+1}. ${x.phone}`).join(' | '))-1)];if(!pick)return;let r=await fetch('/api/user/tasks/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,whatsapp_account_id:pick.id})});let x=await r.json();alert(x.message||'Done');load()}function esc(s){return String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
