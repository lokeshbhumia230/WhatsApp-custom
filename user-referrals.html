<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Referrals</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.muted{color:#666;font-size:13px}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>Referrals & MLM</h1><div class="card"><b>Total Referral Commission</b><h2 id="total">₹0.00</h2></div><div id="list">Loading...</div></main><script>async function load(){let r=await fetch('/api/user/referrals');if(r.status===401){location.href='/login';return}let d=await r.json();total.textContent='₹'+Number(d.total_commission||0).toFixed(2);list.innerHTML=(d.referrals||[]).map(x=>`<div class="card"><b>${esc(x.name)}</b><p>User ID: ${esc(x.user_id)}</p><p class="muted">Joined: ${new Date(x.joined_at).toLocaleString()}</p><b>Commission: ₹${Number(x.commission||0).toFixed(2)}</b></div>`).join('')||'<p class="muted">No referrals yet.</p>'}function esc(s){return String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
