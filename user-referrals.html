<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Referrals</title><style>body{font-family:system-ui;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#666;font-size:13px}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>Referral & MLM</h1><div class="card"><h2>Total Referral Commission: ₹<span id="total">0.00</span></h2><p class="muted">Share your referral code from the dashboard. Commissions are credited according to the admin-configured MLM levels.</p><div id="list">Loading...</div></div></main><script>fetch('/api/user/referrals').then(r=>r.status===401?location='/login':r.json()).then(d=>{if(!d||d.status!=='success')return;total.textContent=Number(d.total_commission).toFixed(2);list.innerHTML=d.referrals.length?d.referrals.map(x=>'<div class="row"><span>'+x.user_id+' • '+x.name+'</span><b>₹'+Number(x.commission).toFixed(2)+'</b></div>').join(''):'<p class="muted">No referrals yet.</p>'})</script></body></html>
