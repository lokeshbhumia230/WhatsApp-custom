<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Devices</title><style>body{margin:0;background:#fff;color:#111;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:850}.muted{color:#777;font-size:13px}.nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.nav a,.btn{border:1px solid #ddd;border-radius:9px;padding:9px 12px;text-decoration:none;color:#111;background:#fff;font-weight:700}.nav a.active,.btn.primary{background:#111;color:#fff;border-color:#111}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1}.toolbar input{padding:11px;border:1px solid #ddd;border-radius:9px}.card{border:1px solid #e5e5e5;border-radius:14px;padding:16px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:15px}.meta{color:#777;font-size:12px;line-height:1.7;margin-top:5px}.pill{padding:4px 8px;border-radius:99px;background:#111;color:#fff;font-size:11px}.pill.off{background:#f2f2f2;color:#666}.dots{width:36px;height:36px;border:1px solid #ddd;background:#fff;border-radius:8px;font-size:20px}.menu{position:relative}.panel{display:none;position:absolute;right:0;top:42px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:5px;min-width:180px;z-index:5;box-shadow:0 10px 25px #0002}.menu.open .panel{display:block}.panel button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px;border-radius:7px}.panel button:hover{background:#f4f4f4}.danger{color:#b00000}.stats{display:flex;gap:10px;margin:15px 0}.stat{border:1px solid #e5e5e5;border-radius:12px;padding:12px 16px;min-width:110px}.stat b{display:block;font-size:22px}@media(max-width:600px){.row{align-items:flex-start}.stats{flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">88Task <span>Devices</span></div><div class="muted">WhatsApp session management</div></div></div><nav class="nav"><a href="/admin">Dashboard</a><a class="active" href="/admin/devices">Devices</a><a href="/admin/pair">Pair WhatsApp</a><a href="/admin/settings">Settings</a><a href="#" onclick="lock();return false">Logout</a></nav><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="online">0</b><span>Connected</span></div><div class="stat"><b id="offline">0</b><span>Offline</span></div></div><div class="toolbar"><input id="q" placeholder="Search User ID or phone…" oninput="render()"><button class="btn" onclick="load()">Refresh</button></div><div id="list">Loading…</div></main><script>const A=location.origin;let ds=[];const H=()=>({'X-Admin-Token':sessionStorage.getItem('admin_token')||''});async function api(p,o={}){o.headers={...(o.headers||{}),...H()};let r=await fetch(A+p,o);if(r.status===401){lock();throw Error('Unauthorized')}return r.json()}async function load(){try{let d=await api('/admin/devices');ds=d.devices||[];render()}catch(e){}}function render(){let q=document.getElementById('q').value.toLowerCase();let x=ds.filter(d=>(d.user_id+' '+d.phone).toLowerCase().includes(q));total.textContent=ds.length;online.textContent=ds.filter(d=>d.connected).length;offline.textContent=ds.filter(d=>!d.connected).length;list.innerHTML=x.length?x.map(d=>`<div class="card"><div class="row"><div><b>${esc(d.user_id)}</b> <span class="pill ${d.connected?'':'off'}">${esc(d.state)}</span><div class="meta">WhatsApp: ${esc(d.phone||'Unknown')}<br>Last updated: ${esc(d.updated_at||'—')}</div></div><div class="menu"><button class="dots" onclick="toggle(event,this)">⋮</button><div class="panel"><button onclick="location.href='/admin/device?user_id=${enc(d.user_id)}'">View Details</button><button onclick="reconnect('${enc(d.user_id)}')">Reconnect</button><button onclick="send('${enc(d.user_id)}','${enc(d.phone||'')}')">Send Test Message</button><button class="danger" onclick="logout('${enc(d.user_id)}')">Logout Device</button></div></div></div></div>`).join(''):'<div class="card">No devices found.</div>'}function toggle(e,b){e.stopPropagation();document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));b.parentElement.classList.add('open')}document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open')));async function reconnect(u){let d=await api('/admin/reconnect?user_id='+u,{method:'POST'});alert(d.message||'Done');load()}async function send(u,p){let t=prompt('Recipient phone number:',decodeURIComponent(p));if(!t)return;let m=prompt('Message:','88Task test message');if(!m)return;let d=await api('/admin/test-send?user_id='+u+'&phone='+encodeURIComponent(t)+'&text='+encodeURIComponent(m));alert(d.message||'Sent');load()}async function logout(u){if(!confirm('Logout this WhatsApp device?'))return;await api('/admin/logout?user_id='+u,{method:'POST'});load()}function lock(){sessionStorage.removeItem('admin_token');location.href='/admin'}function enc(x){return encodeURIComponent(x)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(!sessionStorage.getItem('admin_token'))lock();load()</script></body></html>
