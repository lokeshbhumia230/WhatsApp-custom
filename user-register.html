<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Register</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.box{max-width:420px;margin:8vh auto;padding:28px;border:1px solid #ddd;border-radius:16px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #bbb;border-radius:8px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}a{color:#111;font-weight:700}.msg{margin-top:14px}</style></head><body><main class="box"><h1>Create account</h1><p>Join LUMO and start earning from eligible WhatsApp tasks.</p><label>Name</label><input id="name" autocomplete="name"><label>Password</label><input id="password" type="password" autocomplete="new-password"><label>Referral code (optional)</label><input id="ref" value=""><button onclick="register()">Create Account</button><div id="msg" class="msg"></div><p>Already registered? <a href="/login">Login</a></p></main><script>const p=new URLSearchParams(location.search);ref.value=p.get('ref')||'';async function register(){msg.textContent='Creating account...';let r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,password:password.value,referral_code:ref.value})});let d=await r.json().catch(()=>({}));msg.textContent=d.message||'Something went wrong';if(d.status==='success'){msg.textContent='Account created. Your User ID: '+d.user_id+' • Referral Code: '+d.referral_code;setTimeout(()=>location.href='/dashboard',1200)}} </script></body></html>
