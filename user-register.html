<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Register</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.box{max-width:420px;margin:8vh auto;padding:28px;border:1px solid #ddd;border-radius:16px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #bbb;border-radius:8px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}a{color:#111;font-weight:700}.msg{margin-top:14px}</style></head><body><main class="box"><h1>Create account</h1><p>Join LUMO and start earning from eligible WhatsApp tasks.</p><label>Name</label><input id="name" autocomplete="name"><label>Password</label><input id="password" type="password" autocomplete="new-password"><label>Referral code (optional)</label><input id="ref" value=""><button type="button" id="registerBtn">Create Account</button><div id="msg" class="msg"></div><p>Already registered? <a href="/login">Login</a></p></main><script>const nameInput=document.getElementById('name');const passwordInput=document.getElementById('password');const refInput=document.getElementById('ref');const msgEl=document.getElementById('msg');const registerBtn=document.getElementById('registerBtn');const p=new URLSearchParams(location.search);refInput.value=p.get('ref')||'';async function register(){const nameValue=nameInput.value.trim();const passwordValue=passwordInput.value;const referralValue=refInput.value.trim();if(nameValue.length<2||passwordValue.length<6){msgEl.textContent='Name and password (minimum 6 characters) are required';return}registerBtn.disabled=true;msgEl.textContent='Creating account...';try{const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:nameValue,password:passwordValue,referral_code:referralValue})});const d=await r.json().catch(()=>({}));msgEl.textContent=d.message||'Something went wrong';if(d.status==='success'){msgEl.textContent='Account created. Your User ID: '+d.user_id+' • Referral Code: '+d.referral_code;setTimeout(()=>location.href='/dashboard',1200)}}catch(e){msgEl.textContent='Network error. Please try again.'}finally{registerBtn.disabled=false}}registerBtn.addEventListener('click',register);</script></body></html>
