<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Connect WhatsApp</title><style>body{margin:0;background:#f7f7f7;color:#111;font:15px Inter,system-ui,sans-serif}.wrap{max-width:520px;margin:0 auto;padding:50px 20px}.brand{text-align:center;font-size:27px;font-weight:850}.sub{text-align:center;color:#777;margin:7px 0 28px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:22px;box-shadow:0 8px 30px #0000000d}label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}.hint{font-size:12px;color:#777;margin-top:7px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:750;font-size:15px}.code{display:none;margin-top:18px;padding:18px;text-align:center;border:1px dashed #aaa;border-radius:11px;background:#fafafa}.code b{display:block;font-size:30px;letter-spacing:5px;margin-top:5px}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#f4f4f4;color:#444;line-height:1.5}.ok{background:#eefaf3;color:#17633b}.err{background:#fff1f1;color:#9b2020}</style></head><body><main class="wrap"><div class="brand">88Task</div><div class="sub">Connect your WhatsApp securely</div><section class="card"><label for="phone">WhatsApp phone number</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="919876543210"><div class="hint">Enter your number with country code, without + or spaces.</div><button id="start" onclick="startPairing()">Generate Pairing Code</button><div id="code" class="code">Enter this code in WhatsApp:<b id="codeText">—</b></div><div id="msg" class="msg"></div></section></main><script>const token=location.pathname.split('/').filter(Boolean).pop();let timer=null;function show(text,type=''){const e=document.getElementById('msg');e.textContent=text;e.className='msg '+type;e.style.display='block'}async function startPairing(){const phone=document.getElementById('phone').value.trim();if(!phone)return show('Please enter your WhatsApp phone number.','err');const b=document.getElementById('start');b.disabled=true;b.textContent='Generating…';try{const r=await fetch('/connect/pair?token='+encodeURIComponent(token)+'&phone='+encodeURIComponent(phone),{method:'POST'});const d=await r.json();if(!r.ok||d.status!=='success'){show(d.message||'Unable to start pairing.','err');b.disabled=false;b.textContent='Generate Pairing Code';return}document.getElementById('codeText').textContent=d.code||'—';document.getElementById('code').style.display='block';show('Open WhatsApp on your phone and enter the pairing code. This page will automatically detect when the connection is complete.');timer=setInterval(checkStatus,2500);checkStatus()}catch(e){show('Network error. Please try again.','err');b.disabled=false;b.textContent='Generate Pairing Code'}}async function checkStatus(){try{const r=await fetch('/connect/status?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(d.state==='ready'){clearInterval(timer);document.getElementById('code').style.display='none';document.getElementById('start').style.display='none';show('WhatsApp connected successfully. You can now close this page.','ok')}}catch(e){}}</script></body></html>
