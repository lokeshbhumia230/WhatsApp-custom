<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Login</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.box{max-width:420px;margin:8vh auto;padding:28px;border:1px solid #ddd;border-radius:16px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border:1px solid #bbb;border-radius:8px}button{width:100%;padding:13px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}a{color:#111;font-weight:700}.msg{margin-top:14px}</style></head><body><main class="box"><h1>Welcome back</h1><label>User ID</label><input id="uid" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Login</button><div id="msg" class="msg"></div><p>New user? <a href="/register">Create account</a></p></main><script>async function login(){msg.textContent='Signing in...';let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid.value,password:password.value})});let d=await r.json().catch(()=>({}));msg.textContent=d.message||'Something went wrong';if(d.status==='success')location.href='/dashboard'}</script></body></html>
