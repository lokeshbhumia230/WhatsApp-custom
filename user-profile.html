<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Profile</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.wrap{max-width:700px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.label{color:#666;font-size:13px}.value{font-weight:800;margin:5px 0 15px}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>Profile</h1><div class="card"><div class="label">Name</div><div id="name" class="value">—</div><div class="label">LUMO User ID</div><div id="uid" class="value">—</div><div class="label">Referral Code</div><div id="ref" class="value">—</div><div class="label">Balance</div><div id="bal" class="value">—</div></div></main><script>async function load(){let r=await fetch('/api/user/profile');if(r.status===401){location.href='/login';return}let d=await r.json();name.textContent=d.name;uid.textContent=d.user_id;ref.textContent=d.referral_code;bal.textContent='₹'+Number(d.balance).toFixed(2)}load()</script></body></html>
