<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • Customer Care</title><style>body{font-family:system-ui;background:#fff;color:#111;margin:0}.wrap{max-width:760px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:7px 0 12px;border:1px solid #bbb;border-radius:8px}textarea{min-height:120px}button{padding:11px 15px;background:#111;color:#fff;border:0;border-radius:8px;font-weight:700}.ticket{border-top:1px solid #eee;padding:12px 0}.muted{color:#666;font-size:13px}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a></nav><h1>Customer Care</h1><div class="card"><h2>Contact Support</h2><input id="subject" placeholder="Subject"><textarea id="message" placeholder="Describe your issue"></textarea><button onclick="send()">Submit Ticket</button><p id="msg" class="muted"></p></div><div class="card"><h2>My Tickets</h2><div id="list">Loading...</div></div></main><script>async function load(){let r=await fetch('/api/user/support');if(r.status===401){location='/login';return}let d=await r.json();list.innerHTML=(d.tickets||[]).map(x=>'<div class="ticket"><b>'+x.subject+'</b><br>'+x.message+'<br><span class="muted">Status: '+x.status+'</span></div>').join('')||'<p class="muted">No tickets.</p>'}async function send(){let r=await fetch('/api/user/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:subject.value,message:message.value})});let d=await r.json();msg.textContent=d.message||'Submitted';if(d.status==='success'){subject.value='';message.value='';load()}}load()</script></body></html>
