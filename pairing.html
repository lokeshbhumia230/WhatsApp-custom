<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Device Manager</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ee;background:#0b1110}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17342b 0,#0b1110 45%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{font-size:24px;font-weight:800}.muted{color:#93a59e;font-size:13px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:#101917;border:1px solid #26332f;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0005}h2{margin:0 0 16px;font-size:18px}label{display:block;font-size:12px;color:#9bada5;margin:12px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #33443e;border-radius:10px;background:#0b1210;color:#fff;outline:none}input:focus{border-color:#49c98a}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:#29b873;color:#06100b}button.secondary{background:#1b2824;color:#dce8e3;border:1px solid #33443e}button.danger{background:#d95c5c;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.code{font-size:28px;letter-spacing:4px;font-weight:800;text-align:center;padding:18px;background:#0a1210;border:1px dashed #3d6d59;border-radius:12px;margin-top:14px}.notice{margin-top:12px;padding:10px 12px;border-radius:10px;background:#14241e;color:#bfe8d1;font-size:13px}.error{background:#2a1717;color:#ffc1c1}.device{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid #26332f;border-radius:14px;padding:15px;margin-bottom:10px;background:#0d1513}.device strong{display:block}.meta{font-size:12px;color:#93a59e;margin-top:5px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;background:#153c2d;color:#7ce0aa;margin-left:6px}.pill.off{background:#382020;color:#ff9e9e}.empty{text-align:center;padding:35px;color:#7f918a}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">WhatsApp Device Manager</div><div class="muted">Pair, monitor and control linked WhatsApp sessions</div></div><button class="secondary" onclick="loadDevices()">Refresh</button></div>
  <div class="grid">
    <section class="card">
      <h2>Pair WhatsApp</h2>
      <label>App User ID</label><input id="userId" placeholder="e.g. 12345">
      <label>WhatsApp phone number</label><input id="phone" inputmode="numeric" placeholder="919876543210">
      <div class="actions"><button onclick="pair()">Generate Pairing Code</button></div>
      <div id="pairCode" class="code hidden"></div>
      <div id="message" class="notice hidden"></div>
      <p class="muted" style="margin-top:16px">Enter the code in WhatsApp → Linked devices → Link a device → Link with phone number.</p>
    </section>
    <section class="card">
      <div class="bar"><div><h2 style="margin-bottom:3px">Linked Devices</h2><span id="count" class="muted">Loading…</span></div></div>
      <div id="devices"><div class="empty">Loading devices…</div></div>
    </section>
  </div>
</div>
<script>
const API=location.origin;
function show(text,error=false){const el=document.getElementById('message');el.textContent=text;el.className='notice'+(error?' error':'');el.classList.remove('hidden')}
async function pair(){
 const uid=document.getElementById('userId').value.trim(), phone=document.getElementById('phone').value.trim();
 if(!uid||!phone)return show('User ID and phone number are required.',true);
 try{const r=await fetch(`${API}/pair?user_id=${encodeURIComponent(uid)}&phone=${encodeURIComponent(phone)}`);const d=await r.json();
  if(d.status!=='success')return show(d.message||'Pairing failed.',true);
  const c=document.getElementById('pairCode');c.textContent=d.code||'Waiting…';c.classList.remove('hidden');show('Pairing started. Keep this page open and wait for the device to become ready.');poll(uid);
 }catch(e){show('Server connection failed.',true)}
}
async function poll(uid){for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch(`${API}/status?user_id=${encodeURIComponent(uid)}`);const d=await r.json();if(d.state==='ready'){show('WhatsApp connected successfully.');loadDevices();return}}catch(e){}}}
async function loadDevices(){
 const box=document.getElementById('devices');box.innerHTML='<div class="empty">Loading devices…</div>';
 try{const r=await fetch(`${API}/devices`);const d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to load devices');
  document.getElementById('count').textContent=`${d.devices?.length||0} linked device(s)`;
  if(!d.devices?.length){box.innerHTML='<div class="empty">No linked devices yet.</div>';return}
  box.innerHTML=d.devices.map(x=>`<div class="device"><div><strong>${escapeHtml(x.user_id)} <span class="pill ${x.connected?'':'off'}">${escapeHtml(x.state)}</span></strong><div class="meta">WhatsApp: ${escapeHtml(x.phone||'Unknown')} · Updated ${escapeHtml(x.updated_at||'—')}</div></div><button class="danger" onclick="logout('${encodeURIComponent(x.user_id)}')">Logout</button></div>`).join('');
 }catch(e){box.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`;document.getElementById('count').textContent='Unable to load'}
}
async function logout(uid){if(!confirm('Logout this WhatsApp device?'))return;try{const r=await fetch(`${API}/logout?user_id=${uid}`,{method:'POST'});const d=await r.json();if(!r.ok||d.status!=='success')return alert(d.message||'Logout failed');loadDevices()}catch(e){alert('Server connection failed')}}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
loadDevices();setInterval(loadDevices,5000);
</script>
</body>
</html>
