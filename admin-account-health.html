<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Account Health</title><style>body{font:14px system-ui;margin:0;color:#111;background:#fff}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#777}.btn{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700;text-decoration:none;color:#111}.card{border:1px solid #e5e5e5;border-radius:14px;padding:18px;margin-top:16px;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;min-width:800px}.box{border:1px solid #eee;border-radius:10px;padding:12px}.value{font-size:20px;font-weight:800;margin-top:4px}.healthy{font-weight:800}.bad{font-weight:800}.warn{font-weight:800}@media(max-width:700px){.wrap{padding:16px}}</style></head><body><main class="wrap"><div class="top"><div><h1>WhatsApp Account Health</h1><div class="muted">Server-reported reachout timelock and new-chat capping state</div></div><a class="btn" href="/admin">Dashboard</a></div><div id="body" class="card">Loading…</div></main><script>const key='admin_token';function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}async function api(url){let t=sessionStorage.getItem(key);let r=await fetch(url,{headers:{'X-Admin-Token':t}});if(r.status===401){location.href='/admin';throw 0}return r.json()}async function load(){if(!sessionStorage.getItem(key)){location.href='/admin';return}let d=await api('/admin/devices/data'),xs=d.devices||[];if(!xs.length){document.getElementById('body').textContent='No connected accounts.';return}let out='';for(const x of xs){let uid=x.user_id||x.userId||x.id;let h=await api('/admin/account-health/data?user_id='+encodeURIComponent(uid));out+='<section class="card"><b>'+esc(uid)+'</b><div class="row"><div class="box"><div class="muted">Health</div><div class="value">'+esc(h.status)+'</div></div><div class="box"><div class="muted">Reachout timelock</div><div class="value">'+(h.timelock_active?'ACTIVE':'Clear')+'</div><div class="muted">'+esc(h.timelock_type||'')+(h.timelock_until?' • '+esc(h.timelock_until):'')+'</div></div><div class="box"><div class="muted">New-chat cap</div><div class="value">'+esc(h.cap_status||'Unknown')+'</div><div class="muted">'+h.cap_used+' / '+h.cap_total+' used</div></div><div class="box"><button class="btn" onclick="refreshHealth('+JSON.stringify(uid)+')">Refresh from WhatsApp</button><div class="muted" style="margin-top:8px">Last check: '+esc(h.last_checked_at||'never')+'</div></div></div></section>'}document.getElementById('body').innerHTML=out}async function refreshHealth(uid){await api('/admin/account-health/refresh?user_id='+encodeURIComponent(uid));await load()}load()</script></body></html>
