<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • WhatsApp</title><style>body{font-family:system-ui,sans-serif;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.muted{color:#666;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>WhatsApp Accounts</h1><p class="muted">Maximum 3 linked WhatsApp accounts.</p><div id="list">Loading...</div><div class="card"><h2>Link WhatsApp</h2><p>Use the pairing link provided by LUMO support/admin to link a new WhatsApp account.</p><p class="muted">A new account will be available here after successful pairing.</p></div></main><script>async function load(){let r=await fetch('/api/user/whatsapp');if(r.status===401){location.href='/login';return}let d=await r.json();list.innerHTML=(d.accounts||[]).map(x=>`<article class="card"><div class="row"><div><h2>+${esc(x.phone)}</h2><b>${x.connected?'Connected':'Disconnected'}</b><p class="muted">Current sends: ${x.current_send_total} • Today: ${x.today_send_total}</p></div><button onclick="removeWA('${x.id}')">Remove</button></div></article>`).join('')||'<div class="card">No WhatsApp account linked.</div>'}async function removeWA(id){if(!confirm('Remove this WhatsApp account?'))return;let r=await fetch('/api/user/whatsapp/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_id:id})});let d=await r.json();alert(d.message||'Done');load()}function esc(s){return String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load();setInterval(load,10000)</script></body></html>
