<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMO • WhatsApp</title><style>body{font-family:system-ui;background:#fff;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:14px}.nav a{padding:9px 12px;border:1px solid #ccc;border-radius:8px;color:#111;text-decoration:none;font-weight:700}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:14px 0}.muted{color:#666;font-size:13px}button{padding:9px 12px;border-radius:8px;border:1px solid #111;background:#111;color:#fff;font-weight:700}input{padding:10px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box;max-width:360px}.code{font-size:28px;letter-spacing:5px;font-weight:800;margin:12px 0}</style></head><body><main class="wrap"><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/tasks">Tasks</a><a href="/whatsapp">WhatsApp</a><a href="/referrals">Referrals</a><a href="/profile">Profile</a><a href="/support">Customer Care</a></nav><h1>WhatsApp Accounts</h1><div class="card"><b>Maximum 3 accounts</b><p class="muted">Link up to three WhatsApp accounts. Each account has its own session and safety limits.</p><input id="phone" inputmode="numeric" placeholder="WhatsApp number with country code"><p><button onclick="pair()">Link WhatsApp</button></p><div id="pairMsg" class="muted"></div><div id="code" class="code"></div></div><div class="card"><p id="msg" class="muted"></p><div id="list"></div></div></main><script>let timer=null;async function load(){let r=await fetch('/api/user/whatsapp');if(r.status===401){location='/login';return}let d=await r.json();if(d.status!=='success'){msg.textContent='Unable to load accounts';return}list.innerHTML=d.accounts.map(x=>'<div class="row"><div><b>'+x.phone+'</b><br><span class="muted">'+(x.connected?'Connected':'Disconnected')+' • Today: '+x.today_send_total+' • Total: '+x.current_send_total+'</span></div><button onclick="removeWA(\''+x.id+'\')">Remove</button></div>').join('')||'<p class="muted">No WhatsApp account linked yet.</p>'}async function pair(){clearInterval(timer);pairMsg.textContent='Starting pairing…';code.textContent='';let p=phone.value.trim();let r=await fetch('/api/user/whatsapp/pair?phone='+encodeURIComponent(p),{method:'POST'});let d=await r.json();if(d.status!=='success'){pairMsg.textContent=d.message||'Pairing failed';return}code.textContent=d.code;pairMsg.textContent='Enter this code in WhatsApp → Linked devices → Link a device. Waiting…';let key=d.session_key;let left=160;timer=setInterval(async()=>{left--;if(left<=0){clearInterval(timer);pairMsg.textContent='Pairing session expired. Start again.';return}let s=await fetch('/api/user/whatsapp/pair/status?session_key='+encodeURIComponent(key));let x=await s.json();if(x.status==='success'&&x.state==='ready'){clearInterval(timer);pairMsg.textContent='WhatsApp connected successfully.';code.textContent='';phone.value='';load()}else if(s.status===410){clearInterval(timer);pairMsg.textContent=x.message||'Pairing expired'}},1000)}async function removeWA(id){if(!confirm('Remove this WhatsApp account?'))return;let r=await fetch('/api/user/whatsapp/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_id:id})});let d=await r.json();msg.textContent=d.message||'Done';load()}load()</script></body></html>
