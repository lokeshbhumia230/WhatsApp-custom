<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Device Details</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ee;background:#07100d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#174233 0,#07100d 45%)}.wrap{max-width:900px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:23px;font-weight:850}.muted{color:#8fa39a;font-size:13px}.card{background:#0d1714;border:1px solid #263832;border-radius:18px;padding:20px;box-shadow:0 14px 45px #0006}.back{background:#182721;color:#dce8e2;border:1px solid #31453d;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.hero{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.title{font-size:28px;font-weight:850}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;background:#123b2b;color:#79dfa8;margin-left:8px}.off{background:#3a2020;color:#ff9d9d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.item{padding:15px;border:1px solid #263832;border-radius:13px;background:#0a1210}.label{font-size:11px;color:#8fa39a;text-transform:uppercase;letter-spacing:.06em}.value{margin-top:7px;font-size:16px;font-weight:700;word-break:break-word}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}button.action{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer;background:#25b875;color:#041009}button.danger{background:#c95151;color:white}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{flex-direction:column}.title{font-size:23px}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">88Task</div><div class="muted">WhatsApp SaaS Administration</div></div><button class="back" onclick="location.href='/admin'">← Back to devices</button></div><section class="card"><div id="content">Loading device…</div></section></main><script>const token=sessionStorage.getItem('admin_token')||'';const uid=new URLSearchParams(location.search).get('user_id');function esc(v){return String(v??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(p,o={}){o.headers={...(o.headers||{}),'X-Admin-Token':token};const r=await fetch(p,o);if(r.status===401){sessionStorage.removeItem('admin_token');location.href='/admin';throw Error('Unauthorized')}const d=await r.json();if(!r.ok||d.status==='error')throw Error(d.message||'Request failed');return d}async function load(){if(!token||!uid){location.href='/admin';return}try{const d=await api('/admin/status?user_id='+encodeURIComponent(uid));document.getElementById('content').innerHTML='<div class="hero"><div><div class="title">WhatsApp Device <span class="pill '+(d.connected?'':'off')+'">'+esc(d.state||'unknown')+'</span></div><div class="muted">Detailed session information and controls</div></div></div><div class="grid"><div class="item"><div class="label">App User ID</div><div class="value">'+esc(d.user_id)+'</div></div><div class="item"><div class="label">Connection</div><div class="value">'+(d.connected?'Connected':'Offline')+'</div></div><div class="item"><div class="label">Session State</div><div class="value">'+esc(d.state)+'</div></div><div class="item"><div class="label">Server Time</div><div class="value">'+esc(d.server_time)+'</div></div></div><div class="actions"><button class="action" onclick="reconnect()">Reconnect</button><button class="action" onclick="testSend()">Send Test Message</button><button class="action danger" onclick="logoutDevice()">Logout Device</button></div>'}catch(e){document.getElementById('content').innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function reconnect(){try{const d=await api('/admin/reconnect?user_id='+encodeURIComponent(uid),{method:'POST'});alert(d.message||'Reconnect requested');load()}catch(e){alert(e.message)}}async function testSend(){const target=prompt('Test message recipient phone number:');if(!target)return;const text=prompt('Test message:','88Task test message');if(!text)return;try{const d=await api('/admin/test-send?user_id='+encodeURIComponent(uid)+'&phone='+encodeURIComponent(target)+'&text='+encodeURIComponent(text));alert(d.message||'Message sent')}catch(e){alert(e.message)}}async function logoutDevice(){if(!confirm('Logout and clear this WhatsApp session?'))return;try{await api('/admin/logout?user_id='+encodeURIComponent(uid),{method:'POST'});location.href='/admin'}catch(e){alert(e.message)}}load();</script></body></html>
