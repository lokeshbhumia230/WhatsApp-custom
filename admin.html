<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • WhatsApp Admin</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:#111}.wrap{max-width:1280px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:25px;font-weight:850;letter-spacing:-.6px}.brand span{font-weight:500;color:#666}.muted{color:#6b6b6b;font-size:13px}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:18px;box-shadow:0 5px 20px #00000008}h2{font-size:16px;margin:0 0 14px}label{display:block;color:#555;font-size:12px;font-weight:650;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid #d8d8d8;border-radius:9px;background:#fff;color:#111;outline:none}input:focus{border-color:#111;box-shadow:0 0 0 3px #1111}button{border:1px solid #111;border-radius:9px;padding:10px 13px;font-weight:750;cursor:pointer;background:#111;color:#fff}button.secondary{background:#fff;color:#111;border-color:#d5d5d5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.code{font-size:28px;letter-spacing:5px;text-align:center;font-weight:850;padding:17px;border:1px dashed #aaa;border-radius:11px;background:#fafafa;margin-top:14px}.notice{margin-top:12px;padding:10px 12px;border-radius:9px;background:#f6f6f6;color:#222;font-size:13px;border:1px solid #e6e6e6}.error{background:#fff5f5;color:#a00000;border-color:#efcaca}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.stat{padding:15px;border:1px solid #e5e5e5;border-radius:12px;background:#fff}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#777}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1}.device{position:relative;border:1px solid #e5e5e5;border-radius:12px;padding:15px;margin:9px 0;background:#fff}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.device strong{display:block}.meta{font-size:12px;color:#777;margin-top:5px;line-height:1.65}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;margin-left:5px;background:#111;color:#fff}.pill.off{background:#f3f3f3;color:#666;border:1px solid #ddd}.menu{position:relative}.dots{width:38px;height:38px;padding:0;border-radius:10px;background:#fff;color:#111;border:1px solid #ddd;font-size:22px;line-height:1}.menu-panel{display:none;position:absolute;right:0;top:44px;z-index:10;min-width:190px;padding:6px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 15px 35px #0002}.menu.open .menu-panel{display:block}.menu-panel button{display:block;width:100%;text-align:left;background:#fff;color:#111;border:0;padding:10px;border-radius:8px}.menu-panel button:hover{background:#f4f4f4}.menu-panel .danger{color:#b00000}.empty{text-align:center;color:#888;padding:32px}.login{max-width:430px;margin:12vh auto}.hidden{display:none}@media(max-width:780px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.row{flex-direction:column}.menu{position:absolute;right:12px;top:12px}.device{padding-right:58px}}@media(max-width:430px){.stats{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div id="login" class="wrap login"><section class="card"><div class="brand">88Task <span>Admin</span></div><p class="muted">Secure WhatsApp SaaS administration</p><label>Admin token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"><div class="actions"><button onclick="login()">Open Dashboard</button></div><div id="loginMsg" class="notice hidden"></div></section></div><div id="app" class="wrap hidden"><div class="top"><div><div class="brand">88Task <span>WhatsApp Manager</span></div><div class="muted">Manage, monitor and control WhatsApp sessions</div></div><div class="actions"><button class="secondary" onclick="loadDevices()">Refresh</button><button class="secondary" onclick="logoutAdmin()">Lock</button></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total devices</span></div><div class="stat"><b id="online">0</b><span>Connected</span></div><div class="stat"><b id="offline">0</b><span>Offline</span></div></div><div class="grid"><section class="card"><h2>Pair New WhatsApp</h2><label>App User ID</label><input id="userId" placeholder="e.g. 12345"><label>WhatsApp phone number</label><input id="phone" inputmode="numeric" placeholder="919876543210"><div class="actions"><button onclick="pair()">Generate Pairing Code</button></div><div id="pairCode" class="code hidden"></div><div id="message" class="notice hidden"></div><p class="muted">WhatsApp → Linked devices → Link a device → Link with phone number.</p></section><section class="card"><div class="toolbar"><input id="search" placeholder="Search User ID, phone or state…" oninput="render()"><button class="secondary" onclick="loadDevices()">Sync</button></div><div id="devices"><div class="empty">Loading devices…</div></div></section></div></div><script>const API=location.origin;let devices=[];function token(){return sessionStorage.getItem('admin_token')||''}function headers(){return {'X-Admin-Token':token()}}function login(){const t=document.getElementById('token').value.trim();if(!t)return loginMessage('Enter admin token.',true);sessionStorage.setItem('admin_token',t);loadDevices()}function logoutAdmin(){sessionStorage.removeItem('admin_token');location.reload()}function loginMessage(x,e){const m=document.getElementById('loginMsg');m.textContent=x;m.className='notice'+(e?' error':'');m.classList.remove('hidden')}async function api(path,opts={}){opts.headers={...(opts.headers||{}),...headers()};const r=await fetch(API+path,opts);if(r.status===401){sessionStorage.removeItem('admin_token');document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');throw new Error('Invalid admin token')}const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Request failed');return d}async function pair(){const uid=document.getElementById('userId').value.trim(),phone=document.getElementById('phone').value.trim();if(!uid||!phone)return show('User ID and phone number are required.',true);try{const d=await api('/admin/pair?user_id='+encodeURIComponent(uid)+'&phone='+encodeURIComponent(phone));document.getElementById('pairCode').textContent=d.code||'Waiting…';document.getElementById('pairCode').classList.remove('hidden');show('Pairing started. Waiting for WhatsApp confirmation.');poll(uid)}catch(e){show(e.message,true)}}async function poll(uid){for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,2000));try{const d=await api('/admin/status?user_id='+encodeURIComponent(uid));if(d.state==='ready'){show('WhatsApp connected successfully.');loadDevices();return}}catch(e){return}}show('Pairing is still pending. Refresh later.')}async function loadDevices(){try{const d=await api('/admin/devices');devices=d.devices||[];render();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}catch(e){if(e.message==='Invalid admin token')loginMessage(e.message,true)}}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=devices.filter(x=>(x.user_id+' '+x.phone+' '+x.state).toLowerCase().includes(q));document.getElementById('total').textContent=devices.length;document.getElementById('online').textContent=devices.filter(x=>x.connected).length;document.getElementById('offline').textContent=devices.filter(x=>!x.connected).length;const box=document.getElementById('devices');if(!list.length){box.innerHTML='<div class="empty">No matching devices.</div>';return}box.innerHTML=list.map(x=>`<div class="device"><div class="row"><div><strong>${esc(x.user_id)} <span class="pill ${x.connected?'':'off'}">${esc(x.state)}</span></strong><div class="meta">WhatsApp: ${esc(x.phone||'Unknown')}<br>Last updated: ${esc(x.updated_at||'—')}</div></div><div class="menu" id="menu-${esc(x.user_id)}"><button class="dots" aria-label="More actions" onclick="toggleMenu(event,this)">⋮</button><div class="menu-panel"><button onclick="viewDevice('${enc(x.user_id)}')">View Details</button><button onclick="reconnect('${enc(x.user_id)}')">Reconnect</button><button onclick="testSend('${enc(x.user_id)}','${enc(x.phone||'')}')">Send Test Message</button><button class="danger" onclick="logoutDevice('${enc(x.user_id)}')">Logout Device</button></div></div></div></div>`).join('')}function toggleMenu(e,btn){e.stopPropagation();document.querySelectorAll('.menu.open').forEach(x=>{if(x!==btn.parentElement)x.classList.remove('open')});btn.parentElement.classList.toggle('open')}document.addEventListener('click',()=>document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open')));function viewDevice(uid){location.href='/admin/device?user_id='+uid}async function reconnect(uid){try{const d=await api('/admin/reconnect?user_id='+uid,{method:'POST'});alert(d.message||'Reconnect requested');loadDevices()}catch(e){alert(e.message)}}async function testSend(uid,phone){const target=prompt('Test message recipient phone number:',decodeURIComponent(phone));if(!target)return;const text=prompt('Test message:','88Task test message');if(!text)return;try{const d=await api('/admin/test-send?user_id='+uid+'&phone='+encodeURIComponent(target)+'&text='+encodeURIComponent(text));alert(d.message||'Message sent');loadDevices()}catch(e){alert(e.message)}}async function logoutDevice(uid){if(!confirm('Logout and clear this WhatsApp session?'))return;try{await api('/admin/logout?user_id='+uid,{method:'POST'});loadDevices()}catch(e){alert(e.message)}}function show(x,e=false){const m=document.getElementById('message');m.textContent=x;m.className='notice'+(e?' error':'');m.classList.remove('hidden')}function enc(x){return encodeURIComponent(x)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}if(token())loadDevices();setInterval(()=>{if(token()&&!document.getElementById('app').classList.contains('hidden'))loadDevices()},5000);</script></body></html>
