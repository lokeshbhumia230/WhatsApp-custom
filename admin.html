<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Dashboard</title><style>body{margin:0;background:#fff;color:#111;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:850}.muted{color:#777;font-size:13px}.dots{width:40px;height:40px;border:1px solid #ddd;background:#fff;border-radius:9px;font-size:23px}.menu{position:relative}.panel{display:none;position:absolute;right:0;top:46px;background:#fff;border:1px solid #ddd;border-radius:11px;padding:6px;min-width:190px;z-index:5;box-shadow:0 12px 30px #0002}.menu.open .panel{display:block}.panel a,.panel button{display:block;width:100%;box-sizing:border-box;padding:10px;border:0;background:#fff;color:#111;text-decoration:none;text-align:left;border-radius:8px;font-weight:650}.panel a:hover,.panel button:hover{background:#f4f4f4}.hero{margin:35px 0 20px}.hero h1{font-size:32px;margin:0 0 6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{border:1px solid #e5e5e5;border-radius:14px;padding:20px}.stat b{font-size:30px;display:block}.stat span{color:#777;font-size:12px}.card{margin-top:18px;border:1px solid #e5e5e5;border-radius:14px;padding:20px}.btn{display:inline-block;margin-top:12px;padding:10px 14px;background:#111;color:#fff;border-radius:9px;text-decoration:none;font-weight:750}@media(max-width:600px){.stats{grid-template-columns:1fr}.hero h1{font-size:27px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">88Task</div><div class="muted">WhatsApp SaaS Control Center</div></div><div class="menu"><button class="dots" onclick="toggle(event)">⋮</button><div class="panel"><a href="/admin">Dashboard</a><a href="/admin/devices">Devices</a><a href="/admin/pair">Pair WhatsApp</a><a href="/admin/settings">Settings</a><button onclick="lock()">Logout</button></div></div></header><section class="hero"><h1>Dashboard</h1><div class="muted">Overview of your WhatsApp infrastructure</div></section><section class="stats"><div class="stat"><b id="total">—</b><span>Total devices</span></div><div class="stat"><b id="online">—</b><span>Connected</span></div><div class="stat"><b id="offline">—</b><span>Offline</span></div></section><section class="card"><b>WhatsApp Devices</b><p class="muted">View and manage all connected WhatsApp sessions from the Devices page.</p><a class="btn" href="/admin/devices">Open Devices</a></section></main><script>async function load(){if(!sessionStorage.getItem('admin_token'))return lock();let r=await fetch('/admin/devices/data',{headers:{'X-Admin-Token':sessionStorage.getItem('admin_token')}});if(r.status===401)return lock();let d=await r.json(),x=d.devices||[];total.textContent=x.length;online.textContent=x.filter(a=>a.connected).length;offline.textContent=x.filter(a=>!a.connected).length}function toggle(e){e.stopPropagation();document.querySelector('.menu').classList.toggle('open')}document.addEventListener('click',()=>document.querySelector('.menu').classList.remove('open'));function lock(){sessionStorage.removeItem('admin_token');location.href='/admin'}load();setInterval(load,5000)</script></body></html>
