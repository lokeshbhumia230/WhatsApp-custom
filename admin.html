<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMO WhatsApp Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf2ee;background:#07100d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#174233 0,#07100d 45%)}.wrap{max-width:1200px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-size:24px;font-weight:850}.muted{color:#8fa39a;font-size:13px}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.card{background:#0d1714;border:1px solid #263832;border-radius:18px;padding:18px;box-shadow:0 14px 45px #0006}h2{font-size:17px;margin:0 0 14px}label{display:block;color:#91a69d;font-size:12px;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #31453d;border-radius:10px;background:#08100e;color:#fff;outline:none}input:focus{border-color:#35c783}button{border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer;background:#25b875;color:#041009}button.secondary{background:#182721;color:#dce8e2;border:1px solid #31453d}button.danger{background:#c95151;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.code{font-size:28px;letter-spacing:5px;text-align:center;font-weight:850;padding:17px;border:1px dashed #3d715b;border-radius:12px;background:#08120f;margin-top:14px}.notice{margin-top:12px;padding:10px 12px;border-radius:10px;background:#12251d;color:#bce8d0;font-size:13px}.error{background:#2b1717;color:#ffc1c1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px;border:1px solid #263832;border-radius:12px;background:#0a1210}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#8fa39a}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1}.device{border:1px solid #263832;border-radius:14px;padding:14px;margin:9px 0;background:#0a1210}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.device strong{display:block}.meta{font-size:12px;color:#8fa39a;margin-top:5px;line-height:1.6}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;margin-left:5px;background:#123b2b;color:#79dfa8}.pill.off{background:#3a2020;color:#ff9d9d}.device-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.device-actions button{font-size:12px;padding:8px 10px}.empty{text-align:center;color:#82958d;padding:32px}.login{max-width:430px;margin:12vh auto}.hidden{display:none}@media(max-width:780px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.row{flex-direction:column}.device-actions button{flex:1}}@media(max-width:430px){.stats{grid-template-columns:1fr}.wrap{padding:16px}}
</style>
</head>
<body>
<div id="login" class="wrap login"><section class="card"><div class="brand">WhatsApp Admin</div><p class="muted">Secure device management panel</p><label>Admin token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"><div class="actions"><button onclick="login()">Open Dashboard</button></div><div id="loginMsg" class="notice hidden"></div></section></div>
<div id="app" class="wrap hidden">
<div class="top"><div><div class="brand">WhatsApp Device Manager</div><div class="muted">Pair, monitor, reconnect, test and logout every linked session</div></div><div class="actions"><button class="secondary" onclick="loadDevices()">Refresh</button><button class="secondary" onclick="logoutAdmin()">Lock</button></div></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total devices</span></div><div class="stat"><b id="online">0</b><span>Connected</span></div><div class="stat"><b id="offline">0</b><span>Offline</span></div></div>
<div class="grid"><section class="card"><h2>Pair New WhatsApp</h2><label>App User ID</label><input id="userId" placeholder="e.g. 12345"><label>WhatsApp phone number</label><input id="phone" inputmode="numeric" placeholder="919876543210"><div class="actions"><button onclick="pair()">Generate Pairing Code</button></div><div id="pairCode" class="code hidden"></div><div id="message" class="notice hidden"></div><p class="muted">WhatsApp → Linked devices → Link a device → Link with phone number.</p></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="Search User ID or phone…" oninput="render()"><button class="secondary" onclick="loadDevices()">Sync</button></div><div id="devices"><div class="empty">Loading devices…</div></div></section></div></div>
<script>
const API=location.origin;let devices=[];
function token(){return sessionStorage.getItem('admin_token')||''}
function headers(){return {'X-Admin-Token':token()}}
function login(){const t=document.getElementById('token').value.trim();if(!t)return loginMessage('Enter admin token.',true);sessionStorage.setItem('admin_token',t);loadDevices().then(()=>{document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}).catch(()=>{})}
function logoutAdmin(){sessionStorage.removeItem('admin_token');location.reload()}
function loginMessage(x,e){const m=document.getElementById('loginMsg');m.textContent=x;m.className='notice'+(e?' error':'');m.classList.remove('hidden')}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),...headers()};const r=await fetch(API+path,opts);if(r.status===401){sessionStorage.removeItem('admin_token');document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');throw new Error('Invalid admin token')}const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Request failed');return d}
async function pair(){const uid=document.getElementById('userId').value.trim(),phone=document.getElementById('phone').value.trim();if(!uid||!phone)return show('User ID and phone number are required.',true);try{const d=await api(`/admin/pair?user_id=${encodeURIComponent(uid)}&phone=${encodeURIComponent(phone)}`);document.getElementById('pairCode').textContent=d.code||'Waiting…';document.getElementById('pairCode').classList.remove('hidden');show('Pairing started. Waiting for WhatsApp confirmation.');poll(uid)}catch(e){show(e.message,true)}}
async function poll(uid){for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,2000));try{const d=await api(`/admin/status?user_id=${encodeURIComponent(uid)}`);if(d.state==='ready'){show('WhatsApp connected successfully.');loadDevices();return}}catch(e){return}}show('Pairing is still pending. Refresh later.')}
async function loadDevices(){try{const d=await api('/admin/devices');devices=d.devices||[];render();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}catch(e){if(e.message==='Invalid admin token')loginMessage(e.message,true)}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=devices.filter(x=>(x.user_id+' '+x.phone+' '+x.state).toLowerCase().includes(q));document.getElementById('total').textContent=devices.length;document.getElementById('online').textContent=devices.filter(x=>x.connected).length;document.getElementById('offline').textContent=devices.filter(x=>!x.connected).length;const box=document.getElementById('devices');if(!list.length){box.innerHTML='<div class="empty">No matching devices.</div>';return}box.innerHTML=list.map(x=>`<div class="device"><div class="row"><div><strong>${esc(x.user_id)} <span class="pill ${x.connected?'':'off'}">${esc(x.state)}</span></strong><div class="meta">WhatsApp: ${esc(x.phone||'Unknown')}<br>Last updated: ${esc(x.updated_at||'—')}</div></div></div><div class="device-actions"><button class="secondary" onclick="reconnect('${enc(x.user_id)}')">Reconnect</button><button class="secondary" onclick="testSend('${enc(x.user_id)}','${enc(x.phone||'')}')">Test Message</button><button class="danger" onclick="logoutDevice('${enc(x.user_id)}')">Logout</button></div></div>`).join('')}
async function reconnect(uid){try{const d=await api(`/admin/reconnect?user_id=${uid}`,{method:'POST'});alert(d.message||'Reconnect requested');loadDevices()}catch(e){alert(e.message)}}
async function testSend(uid,phone){const target=prompt('Test message recipient phone number:',decodeURIComponent(phone));if(!target)return;const text=prompt('Test message:','LUMO test message');if(!text)return;try{const d=await api(`/admin/test-send?user_id=${uid}&phone=${encodeURIComponent(target)}&text=${encodeURIComponent(text)}`);alert(d.message||'Message sent');loadDevices()}catch(e){alert(e.message)}}
async function logoutDevice(uid){if(!confirm('Logout and clear this WhatsApp session?'))return;try{await api(`/admin/logout?user_id=${uid}`,{method:'POST'});loadDevices()}catch(e){alert(e.message)}}
function show(x,e=false){const m=document.getElementById('message');m.textContent=x;m.className='notice'+(e?' error':'');m.classList.remove('hidden')}
function enc(x){return encodeURIComponent(x)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(token())loadDevices();setInterval(()=>{if(token()&&!document.getElementById('app').classList.contains('hidden'))loadDevices()},5000);
</script>
</body></html>
