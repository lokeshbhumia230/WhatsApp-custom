<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>88Task • Pair WhatsApp</title><style>body{margin:0;background:#fff;color:#111;font:14px Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:26px 20px}.brand{font-size:24px;font-weight:850}.brand span{font-weight:500;color:#666}.muted{color:#777;font-size:13px}.nav{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.nav a{border:1px solid #ddd;border-radius:9px;padding:9px 12px;text-decoration:none;color:#111;font-weight:700}.card{border:1px solid #e5e5e5;border-radius:14px;padding:20px}.field{margin:15px 0}label{display:block;font-weight:700;font-size:12px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{border:1px solid #111;background:#111;color:#fff;border-radius:9px;padding:11px 14px;font-weight:750}.code{margin-top:16px;padding:18px;text-align:center;font-size:28px;font-weight:850;letter-spacing:5px;border:1px dashed #aaa;border-radius:10px;background:#fafafa}.notice{margin-top:12px;padding:11px;border:1px solid #e5e5e5;border-radius:9px;color:#555}</style></head><body><main class="wrap"><div class="brand">88Task <span>Pair WhatsApp</span></div><div class="muted">Connect a new WhatsApp account</div><nav class="nav"><a href="/admin">Dashboard</a><a href="/admin/devices">Devices</a><a href="/admin/pair">Pair WhatsApp</a><a href="/admin/settings">Settings</a><a href="#" onclick="lock();return false">Logout</a></nav><section class="card"><div class="field"><label>App User ID</label><input id="u" placeholder="e.g. 12345"></div><div class="field"><label>WhatsApp phone number</label><input id="p" inputmode="numeric" placeholder="919876543210"></div><button onclick="pair()">Generate Pairing Code</button><div id="code" class="code" style="display:none"></div><div id="msg" class="notice" style="display:none"></div></section></main><script>async function api(p){let r=await fetch(location.origin+p,{headers:{'X-Admin-Token':sessionStorage.getItem('admin_token')||''}});if(r.status===401){lock();throw 0}return r.json()}async function pair(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value.trim();if(!u||!p)return show('User ID and phone number are required.');try{let d=await api('/admin/pair/data?user_id='+encodeURIComponent(u)+'&phone='+encodeURIComponent(p));code.textContent=d.code||'Waiting…';code.style.display='block';show('Pairing started. Waiting for WhatsApp confirmation.');poll(u)}catch(e){show('Pairing failed.')}}async function poll(u){for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,2000));let d=await api('/admin/status?user_id='+encodeURIComponent(u));if(d.state==='ready'){show('WhatsApp connected successfully.');return}}show('Pairing is still pending.')}function show(x){msg.textContent=x;msg.style.display='block'}function lock(){sessionStorage.removeItem('admin_token');location.href='/admin'}if(!sessionStorage.getItem('admin_token'))lock()</script></body></html>
